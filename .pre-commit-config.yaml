# Установка: pip install pre-commit && pre-commit install
# Ручной прогон: pre-commit run --all-files

minimum_pre_commit_version: '3.0.0'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^infrastructure/proxmox-setup/scripts/pve/llm-gpu-clones\.registry$
      - id: end-of-file-fixer
        exclude: ^infrastructure/proxmox-setup/scripts/pve/llm-gpu-clones\.registry$

  - repo: local
    hooks:
      - id: check-no-private-leaks
        name: homelab sanitize (local private/ only, skip on public clone)
        entry: scripts/check-no-private-leaks.sh
        language: system
        pass_filenames: true
        files: ^(infrastructure/|README\.md|scripts/).+\.(md|sh|yaml|yml|txt|example|fragment|registry)$
